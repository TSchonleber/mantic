[package]
name = "desktop"
version = "0.1.0"
description = "Mantic — brainctl-powered trading agent platform"
authors = ["Terrence Schonleber"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tschonleber/mantic"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
keyring = "3"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
bs58 = "0.5"
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query"] }
tower-http = { version = "0.5", features = ["fs"] }
rand = "0.8"
hex = "0.4"

[dev-dependencies]
mockito = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

